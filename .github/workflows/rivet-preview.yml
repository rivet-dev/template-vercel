name: Rivet Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: rivet-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rivet-preview:
    name: Rivet Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rivet Preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIVET_CLOUD_TOKEN: ${{ secrets.RIVET_CLOUD_TOKEN }}
          RIVET_ENGINE_ENDPOINT: ${{ vars.RIVET_ENGINE_ENDPOINT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          REPO_FULL_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bun run .github/scripts/rivet-preview.ts
